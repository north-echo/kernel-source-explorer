name: Validate explorer and reading companion
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-and-api:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y git ca-certificates build-essential cmake clang-22 llvm-22-dev libclang-22-dev libclang-cpp22-dev python3-venv
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
          .venv/bin/python -m pip install --no-deps -e .
          npm ci --prefix web
      - name: Build and validate fixture
        run: |
          make indexer LLVM_PREFIX=/usr/lib/llvm-22
          make fixture
          .venv/bin/pytest -q
          npm run build --prefix web
      - name: Export portable fixture for browser checks
        run: python3 scripts/export_dataset.py data/fixture.sqlite data/ci-fixture
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-and-web
          path: |
            data/ci-fixture/
            web/dist/
          retention-days: 3
  browser:
    needs: native-and-api
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: fixture-and-web
          path: .
      - name: Install pinned dependencies and register fixture
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
          .venv/bin/python -m pip install --no-deps -e .
          npm ci --prefix web
          python3 scripts/relocate_dataset.py data/ci-fixture/index.sqlite data/ci-fixture/source
          cp data/ci-fixture/index.sqlite data/fixture.sqlite
      - name: Install test browser on a supported host
        working-directory: web
        run: npx playwright install --with-deps chromium --only-shell
      - name: Check browser navigation and reading companion
        run: npm run test:e2e --prefix web
