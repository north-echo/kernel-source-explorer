name: Validate explorer and reading companion
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fixture-and-browser:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 20
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y git ca-certificates build-essential cmake clang-22 llvm-22-dev libclang-22-dev libclang-cpp22-dev python3-venv libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 libatspi2.0-0t64 libglib2.0-0t64 fonts-liberation libx11-6 libxcb1 libxext6 libdbus-1-3
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
          .venv/bin/python -m pip install --no-deps -e .
          npm ci --prefix web
      - name: Build and validate fixture
        run: |
          make indexer LLVM_PREFIX=/usr/lib/llvm-22
          make fixture
          .venv/bin/pytest -q
          npm run build --prefix web
      - name: Install test browser
        working-directory: web
        run: npx playwright install chromium --only-shell
      - name: Check browser navigation and reading companion
        run: npm run test:e2e --prefix web
